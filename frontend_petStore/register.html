<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — PawStore</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/auth.css" />
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-section auth-section">
      <div class="container">
        <div class="auth-card card auth-card--wide">
          <div class="card__body">
            <h1 class="auth-card__title">Create account</h1>
            <div class="banner banner-error" id="form-banner" role="alert" hidden></div>
            <form class="form" id="register-form" novalidate>
              <div class="form-grid">
                <div class="form-field">
                  <label for="name">First name</label>
                  <input type="text" id="name" name="name" placeholder="Enter your first name" autocomplete="given-name" />
                  <span class="field-error" data-for="name"></span>
                </div>
                <div class="form-field">
                  <label for="lastName">Last name</label>
                  <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" autocomplete="family-name" />
                  <span class="field-error" data-for="lastName"></span>
                </div>
              </div>

              <div class="form-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" autocomplete="email" />
                <span class="field-error" data-for="email"></span>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="password">Password</label>
                  <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" />
                  <span class="field-error" data-for="password"></span>
                </div>
                <div class="form-field">
                  <label for="confirmPassword">Confirm password</label>
                  <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" />
                  <span class="field-error" data-for="confirmPassword"></span>
                </div>
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="phoneNumber">Phone</label>
                  <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="88887777" autocomplete="tel" />
                  <span class="field-error" data-for="phoneNumber"></span>
                </div>
                <div class="form-field">
                  <label for="birthday">Date of birth</label>
                  <input type="date" id="birthday" name="birthday" />
                  <span class="field-error" data-for="birthday"></span>
                </div>
              </div>

              <div class="form-field">
                <label for="shippingAddress">Shipping address</label>
                <input type="text" id="shippingAddress" name="shippingAddress" placeholder="State, city, exact address" autocomplete="street-address" />
                <span class="field-error" data-for="shippingAddress"></span>
              </div>

              <button class="btn btn-primary btn-block" type="submit">Sign up</button>
            </form>
            <p class="auth-card__footer">
              <a href="login.html">I already have an account</a>
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script type="module" src="js/pages/register.page.js"></script>
</body>
</html>
